<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Legal Insight - AI Orchestrator</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; }
        button { background: #007bff; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 1rem; }
        button:hover { background: #0056b3; }
        #response { margin-top: 20px; padding: 10px; border-top: 1px solid #eee; color: #333; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Legal Insight AI</h1>
        <p>Clique no botão para convocar o Orquestrador na AWS.</p>
        <button onclick="callOrchestrator()">Chamar Mensageiro</button>
        <div id="response">Aguardando comando...</div>
    </div>

    <script>
        async function callOrchestrator() {
            const display = document.getElementById('response');
            display.innerText = "Convocando o Mensageiro...";
            
            try {
                // Substituiremos essa URL pela que o Terraform gerou no output
                const API_URL = "SUA_URL_DO_API_GATEWAY_AQUI/orchestrator";
                const response = await fetch(API_URL);
                const data = await response.json();
                
                display.innerText = `Resposta: ${data.message} | DB: ${data.target_db}`;
            } catch (error) {
                display.innerText = "Erro ao contatar a fortaleza: " + error.message;
            }
        }
    </script>
</body>
</html>
